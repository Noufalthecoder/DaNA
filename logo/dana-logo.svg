<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2545"/>
      <stop offset="1" stop-color="#0E4D5C"/>
    </linearGradient>
    <radialGradient id="pearl" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#F7F2EA"/>
      <stop offset="0.75" stop-color="#E4D9CB"/>
      <stop offset="1" stop-color="#C9BBA8"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.7" cy="0.75" r="0.6">
      <stop offset="0" stop-color="#B9E3F0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F3C6D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#F7E7B4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F7E7B4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- pearl -->
  <circle cx="256" cy="190" r="150" fill="url(#glow)"/>
  <circle cx="256" cy="190" r="118" fill="url(#pearl)"/>
  <circle cx="256" cy="190" r="118" fill="url(#iris)"/>
  <ellipse cx="214" cy="140" rx="28" ry="16" fill="#FFFFFF" opacity="0.85" transform="rotate(-30 214 140)"/>

  <!-- DNA double helix inside pearl -->
  <g stroke-linecap="round">
    <g stroke="#0E4D5C" stroke-width="5" opacity="0.55">
      <line x1="235" y1="118" x2="277" y2="118"/>
      <line x1="235" y1="142" x2="277" y2="142"/>
      <line x1="226" y1="160" x2="286" y2="160"/>
      <line x1="235" y1="178" x2="277" y2="178"/>
      <line x1="235" y1="202" x2="277" y2="202"/>
      <line x1="226" y1="220" x2="286" y2="220"/>
      <line x1="235" y1="238" x2="277" y2="238"/>
      <line x1="235" y1="262" x2="277" y2="262"/>
    </g>
    <path d="M226 100 C226 130,286 130,286 160 C286 190,226 190,226 220 C226 250,286 250,286 280"
          fill="none" stroke="#C9A227" stroke-width="10"/>
    <path d="M286 100 C286 130,226 130,226 160 C226 190,286 190,286 220 C286 250,226 250,226 280"
          fill="none" stroke="#1B998B" stroke-width="10"/>
  </g>

  <!-- wordmark: D, N, A highlighted -->
  <text x="256" y="404" text-anchor="middle"
        font-family="'Segoe UI', 'Poppins', Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="2">
    <tspan fill="#E9C46A">D</tspan><tspan fill="#FFFFFF" font-weight="400">a</tspan><tspan fill="#E9C46A">N</tspan><tspan fill="#E9C46A">A</tspan>
  </text>
  <text x="256" y="458" text-anchor="middle"
        font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="34" fill="#B9E3F0" opacity="0.9">دانة</text>
</svg>
