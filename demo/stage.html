<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DaNA demo stage</title>
<style>
  /* 1920x1080 video frame: app area 1920x1000 + caption bar 80 */
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0f1a14; font-family: 'Segoe UI', Inter, sans-serif; }
  #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1000px; transform-origin: 0 0; transition: transform .75s cubic-bezier(.3,.1,.2,1); }
  .panel { position: absolute; top: 0; height: 1000px; overflow: hidden; background: #f6f7f5; transition: left .6s ease, width .6s ease; }
  .panel iframe { border: 0; transform-origin: 0 0; position: absolute; left: 0; top: 0; background: #f6f7f5; }
  .tag { position: absolute; bottom: 14px; left: 14px; z-index: 5; background: rgba(15, 26, 20, .82); color: #fff; font: 700 20px 'Segoe UI'; padding: 7px 16px; border-radius: 999px; }
  .tag:empty { display: none; }
  #divider { position: absolute; top: 0; left: 956px; width: 8px; height: 1000px; background: #0f1a14; z-index: 4; transition: opacity .4s; }
  #cap { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #0f1a14; color: #fff; display: flex; align-items: center; justify-content: center; font: 600 30px 'Segoe UI'; text-align: center; padding: 0 40px; }
  #cap b { color: #6fdc9b; }
  #cur { position: absolute; left: 960px; top: 500px; width: 36px; height: 36px; z-index: 50; pointer-events: none; transition: left .6s cubic-bezier(.3,.1,.2,1), top .6s cubic-bezier(.3,.1,.2,1); }
  #cur svg { filter: drop-shadow(0 3px 4px rgba(0,0,0,.45)); }
  .ripple { position: absolute; width: 26px; height: 26px; border-radius: 50%; border: 5px solid #00a651; z-index: 49; pointer-events: none; animation: rip .7s ease-out forwards; }
  @keyframes rip { from { transform: translate(-50%,-50%) scale(.4); opacity: 1; } to { transform: translate(-50%,-50%) scale(3.2); opacity: 0; } }
  #card { position: absolute; inset: 0; z-index: 60; background: radial-gradient(1200px 600px at 50% 40%, #0a9b4c, #006b32); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; opacity: 0; pointer-events: none; transition: opacity .5s; }
  #card.on { opacity: 1; }
  #card h1 { font: 800 92px 'Segoe UI'; margin: 0; letter-spacing: -1px; }
  #card p { font: 500 36px 'Segoe UI'; margin: 20px 0 0; opacity: .92; max-width: 1400px; }
  #card small { font: 600 24px 'Segoe UI'; margin-top: 34px; opacity: .8; }
</style>
</head>
<body>
<div id="cam">
  <div class="panel" id="pL"><iframe id="fL" allow="autoplay; microphone"></iframe><div class="tag" id="tL"></div></div>
  <div class="panel" id="pR"><iframe id="fR" allow="autoplay; microphone"></iframe><div class="tag" id="tR"></div></div>
  <div id="divider"></div>
</div>
<div id="cap"></div>
<div id="cur"><svg width="36" height="36" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.5L16 20l-3 1.4-3.4-7.3L4 18z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
<div id="card"><h1></h1><p></p><small></small></div>
<script>
  const APP_W = 1440;                      // the app is laid out as on a 1440px-wide laptop
  const cam = document.getElementById('cam');
  let Z = { s: 1, tx: 0, ty: 0 };

  function fit(id, x, w) {
    const p = document.getElementById('p' + id), f = document.getElementById('f' + id);
    p.style.left = x + 'px'; p.style.width = w + 'px';
    if (!w) return;
    const s = w / APP_W;
    f.style.width = APP_W + 'px'; f.style.height = Math.round(1000 / s) + 'px'; f.style.transform = `scale(${s})`;
  }
  window.stage = {
    load(id, url) { document.getElementById('f' + id).src = url; },
    layout(m) {
      if (m === 'L') { fit('L', 0, 1920); fit('R', 1920, 0); }
      else if (m === 'R') { fit('L', -1920, 0); fit('R', 0, 1920); }
      else { fit('L', 0, 956); fit('R', 964, 956); }
      document.getElementById('divider').style.opacity = m === 'split' ? 1 : 0;
    },
    tag(id, t) { document.getElementById('t' + id).textContent = t || ''; },
    cap(html) { document.getElementById('cap').innerHTML = html ? `<span>${html}</span>` : ''; },
    // zoom so screen point (x, y) (measured at zoom 1) comes to the middle, never showing past the edges
    zoom(x, y, s) {
      if (!s || s <= 1) { Z = { s: 1, tx: 0, ty: 0 }; cam.style.transform = 'none'; return Z; }
      let tx = 960 - x * s, ty = 500 - y * s;
      tx = Math.min(0, Math.max(1920 - 1920 * s, tx));
      ty = Math.min(0, Math.max(1000 - 1000 * s, ty));
      Z = { s, tx, ty };
      cam.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
      return Z;
    },
    toScreen(x, y) { return [x * Z.s + Z.tx, y * Z.s + Z.ty]; },
    cursor(x, y) { const c = document.getElementById('cur'); c.style.left = (x - 6) + 'px'; c.style.top = (y - 4) + 'px'; },
    ripple(x, y) {
      const r = document.createElement('div'); r.className = 'ripple'; r.style.left = x + 'px'; r.style.top = y + 'px';
      document.body.appendChild(r); setTimeout(() => r.remove(), 800);
    },
    card(h, p, small) {
      const c = document.getElementById('card');
      if (h === null) { c.classList.remove('on'); return; }
      c.querySelector('h1').textContent = h; c.querySelector('p').textContent = p || ''; c.querySelector('small').textContent = small || '';
      c.classList.add('on');
    },
  };
  stage.layout('split');
</script>
</body>
</html>
